[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-judger"
version = "0.1.0"
description = "LLM-assisted static vulnerability adjudication from SARIF, source code, and project skills."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "vuln_judger contributors" }]
dependencies = []

[project.scripts]
vuln-judger = "vuln_judger.cli:main"

[tool.setuptools.packages.find]
include = ["vuln_judger*"]
